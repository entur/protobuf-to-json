name: Deploy to Maven Central
on:
  workflow_dispatch:

jobs:
  maven-build-and-release:
    uses: entur/gha-maven-central/.github/workflows/maven-publish.yml@v1
    secrets: inherit
    permissions:
      contents: write
      issues: write
    with:
      next_version: minor
      version_strategy: tag
      version_tag_prefix: release-
      java_version: 25
