name: Verify main branch
on:
  push:
    branches:
      - main

jobs:
  validate-maven-build:
    uses: entur/abt-gha-public/.github/workflows/maven-open-source-verify.yml@v2.0
    permissions:
      contents: read
    # no secrets necessary
    with:
      # the stream module targets Java 24, the benchmarks Java 25
      java-version: 25

  validate-oldest-protobuf:
    uses: entur/abt-gha-public/.github/workflows/maven-open-source-verify.yml@v2.0
    permissions:
      contents: read
    # no secrets necessary
    with:
      java-version: 25
      # the oldest supported protobuf version (see the README); the stream writer delegates to the transcoding writer
      # with versions before 4.32, which its tests do not expect, so the stream module is left out
      commands: "-B clean verify --update-snapshots -Dprotobuf.version=4.27.5 -pl transcode,accessor,lite,utility -am"
